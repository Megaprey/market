services:
  showcase:
    container_name: market-showcase-1
    build:
      context: .
      dockerfile: Dockerfile.showcase
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - market-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  wallet:
    container_name: market-wallet-1
    build:
      context: .
      dockerfile: Dockerfile.wallet
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - market-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: postgres-market
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data  
      - ./postgres-config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro  
    command: >
      postgres
      -c listen_addresses='*'
      -c hba_file=/etc/postgresql/pg_hba.conf
    restart: unless-stopped
    networks:
    - market-network
    
  redis:
    image: redis:7.4-alpine # Use the official Redis image, alpine is lightweight
    container_name: market-redis-1
    restart: always
    ports:
      - "6379:6379" # Maps port 6379 on the host to port 6379 in the container
    volumes:
      - redis_data:/data # Persist data in a named volume
    networks:
      - market-network
networks:
  market-network:
    driver: bridge

volumes:
  postgres-data:
  redis_data:
    driver: local

