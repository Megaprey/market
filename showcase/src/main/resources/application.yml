spring:
  application:
    name: my-market-app
  config:
    import:
      - classpath:application-db.yml
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    redis:
      time-to-live: 60000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/market-webflux

webservers:
  wallet:
    host: http:/localhost:8081

server:
  port: 8082