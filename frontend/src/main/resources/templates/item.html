<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="bg-light">
    <div class="container p-2">
        <div class="row p-2">
            <div class="col">
                <div class="hstack gap-3">
                    <h2>
                        <span class="badge text-bg-success">Витрина магазина</span>
                    </h2>
                    <a href="/orders" class="btn btn-secondary ms-auto bi bi-file-earmark-text"> Заказы</a>
                    <a href="/cart/items" class="btn btn-secondary bi bi-cart4"> Корзина</a>
                    <a href="/items" class="btn btn-secondary bi bi-arrow-left-square"> Главная</a>
                </div>
            </div>
        </div>
        <div class="row p-2">
            <div class="col">
                <div class="card">
                    <img class="p-2" th:src="${'/static/'+item.getImgPath()}" alt="Нет изображения" width="350" height="300">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${item.getTitle()}"></h5>
                        <h5>
                            <span class="badge text-bg-success justify-content-end" th:text="${item.getPrice()}+' руб.'"></span>
                        </h5>
                        <p class="card-text" th:text="${item.getDescription()}"></p>
                        <form th:action="@{${'/items/'+item.getId()}}" method="post" th:id="'cartForm_' + ${item.getId()}" class="cartForm">
                            <div class="hstack gap-3">
                                <button type="button" class="btn btn-outline-secondary actionButton" name="action" value="MINUS" th:if="${item.getCount()!=0}">-</button>
                                <span th:text="${item.getCount()}"></span>
                                <button type="button" class="btn btn-outline-secondary actionButton" name="action" value="PLUS">+</button>
                                <button type="button" class="btn btn-warning ms-auto bi bi-cart4 actionButton" name="action" value="PLUS" th:if="${item.getCount()==0}"></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('.actionButton').click(function() {
                var form = $(this).closest('.cartForm');
                var action = $(this).val(); // Получаем значение кнопки

                // Собираем данные из формы
                var data = {
                    id: form.find('input[name="id"]').val(),
                    search: form.find('input[name="search"]').val(),
                    sort: form.find('input[name="sort"]').val(),
                    pageSize: parseInt(form.find('input[name="pageSize"]').val(), 10),
                    pageNumber: parseInt(form.find('input[name="pageNumber"]').val(), 10),
                    action: action
                };

                $.ajax({
                    url: '/items/handle',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function(response) {
                        console.log('Success:', response);
                        // Обновите интерфейс, если необходимо
                        // Например, обновите количество товара
                        var countElement = form.find('span');
                        countElement.text(response.count); // Предполагается, что сервер возвращает новое количество

                        // Перезагрузка страницы
                        location.reload();
                    },
                    error: function(error) {
                        console.error('Error:', error);
                    }
                });
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
